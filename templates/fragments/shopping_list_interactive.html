{# Data injected server-side; x-data reads it via getElementById to avoid JSON/HTML escaping conflicts #}
<div hidden id="shopping-list-json">{{ items | tojson | safe }}</div>

{% if save_banner %}
<div class="mb-4 px-3 py-2 rounded-lg text-xs flex items-center gap-2"
     style="{{ 'background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d' if save_ok else 'background:#fefce8;border:1px solid #fde047;color:#854d0e' }}">
  {{ save_banner | safe }}
</div>
{% endif %}

<div x-data="shoppingListApp()"
     data-item-count="{{ items | length }}"
     class="space-y-4">

  <template x-for="(group, sId) in grouped" :key="sId">
    <div class="card p-5" :style="`border-left:4px solid ${sId === '0' ? '#f59e0b' : '#2563eb'}`">

      <!-- Supplier header -->
      <div class="flex items-start justify-between gap-2 mb-3">
        <div>
          <h3 class="font-bold text-base" style="color:var(--text)"
              x-text="(sId === '0' ? '⚠️ ' : '🏢 ') + group.name"></h3>
          <p class="text-xs mt-0.5" style="color:var(--muted)">
            <span x-text="group.items.length + ' item(ns)'"></span>
            <template x-if="group.total > 0">
              <span> · Estimado:
                <span class="font-mono font-bold" style="color:var(--accent)"
                      x-text="'R$ ' + group.total.toFixed(2)"></span>
              </span>
            </template>
          </p>
        </div>
      </div>

      <!-- Items -->
      <ul class="divide-y" style="border-color:var(--border)">
        <template x-for="item in group.items" :key="item.name">
          <li class="py-3">
            <div class="flex justify-between items-start gap-2">
              <span class="text-sm font-medium" style="color:var(--text)" x-text="item.name"></span>
              <span class="font-bold font-mono text-sm flex-shrink-0" style="color:var(--text)"
                    x-text="item.qty.toFixed(3) + ' ' + item.unit"></span>
            </div>

            <!-- Multi-supplier dropdown -->
            <div x-show="item.alternatives.length > 1" class="mt-2 flex items-center gap-2">
              <label class="text-xs flex-shrink-0" style="color:var(--muted)">Trocar:</label>
              <select x-model="item.selected_supplier_id" class="text-xs py-1" style="min-height:28px">
                <template x-for="alt in item.alternatives" :key="alt.supplier_id">
                  <option :value="alt.supplier_id"
                          x-text="alt.supplier_name + ' — R$ ' + alt.price.toFixed(2) + (alt.brand !== 'Genérica' ? ' (' + alt.brand + ')' : '')">
                  </option>
                </template>
              </select>
            </div>

            <p x-show="item.alternatives.length === 0"
               class="text-xs mt-1" style="color:var(--muted)">
              Sem fornecedor no catálogo
            </p>
          </li>
        </template>
      </ul>

      <!-- CTA -->
      <div class="mt-4 pt-3" style="border-top:1px solid var(--border)">
        <template x-if="sId !== '0' && group.phone">
          <a :href="getWhatsAppLink(group)" target="_blank" rel="noopener"
             class="flex items-center justify-center gap-2 w-full py-2.5 font-semibold text-sm rounded-lg"
             style="background:#16a34a;color:#fff">
            📱 Enviar Pedido para <span x-text="group.name" class="ml-1"></span>
          </a>
        </template>
        <template x-if="sId !== '0' && !group.phone">
          <p class="text-xs" style="color:var(--muted)">
            Cadastre o telefone do fornecedor em
            <a href="/cadastros" style="color:var(--accent)" class="underline">Insumos</a>
            para habilitar o botão WhatsApp.
          </p>
        </template>
        <template x-if="sId === '0'">
          <p class="text-xs px-3 py-2 rounded-lg"
             style="background:#fefce8;border:1px solid #fde047;color:#854d0e">
            ⚠️ Estes insumos não têm fornecedor no catálogo.
            <a href="/cadastros" class="underline font-medium">Cadastre em Insumos →</a>
          </p>
        </template>
      </div>

    </div>
  </template>
</div>
